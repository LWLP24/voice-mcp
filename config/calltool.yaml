server:
  host: 0.0.0.0
  port: 8080
  health_port: 8081
mcp:
  enabled: true
  path: /mcp
  protocol: "2026-07-28"
rest:
  enabled: true
  base_path: /v1
calls:
  max_concurrent: 2
  ring_timeout_seconds: 45
  max_duration_seconds: 1800
  user_input_timeout_seconds: 180
  inbound:
    enabled: true
    organization_name: LWLP
    objective: >-
      Nimm das Anliegen des Anrufers auf, beantworte allgemeine Fragen soweit möglich
      und fasse das Gespräch strukturiert zusammen.
    constraints:
      - Keine verbindlichen Zusagen oder kostenpflichtigen Handlungen vornehmen.
      - Bei fehlenden Informationen transparent bleiben und nichts erfinden.
    room_prefix: calltool-inbound-
    allowed_addresses:
      - 185.246.41.140/32
      - 185.246.41.141/32
voice:
  realtime:
    provider: gemini
    model: gemini-3.1-flash-live-preview
    voice: Puck
    language: de
    thinking_level: minimal
    input_transcription: true
    output_transcription: true
    context_compression:
      enabled: true
    session_resumption:
      enabled: true
    turn_detection:
      mode: realtime_llm
      # For livekit_v1_mini, determine these values with German eval calls.
      # null keeps the detector defaults until that calibration exists.
      unlikely_threshold: null
      backchannel_threshold: null
    # LiveKit's AgentSession default max endpointing delay is 3s. Keep the
    # provider-native Realtime VAD, but bound the local wait for a response.
    endpointing:
      min_delay_seconds: 0.3
      max_delay_seconds: 1.0
    # The LiveKit OpenAI plugin otherwise defaults to semantic VAD (medium).
    # Server VAD gives this phone agent a predictable, low-latency turn end.
    openai_turn_detection:
      mode: server_vad
      threshold: 0.5
      prefix_padding_ms: 300
      silence_duration_ms: 300
      eagerness: medium
    interruptions:
      mode: vad
      min_duration_seconds: 0.15
      false_interruption_timeout_seconds: 1.0
  scripted_tts:
    provider: gemini
    model: gemini-3.1-flash-tts-preview
    voice: Puck
    enabled: true
  shadow_stt:
    enabled: false
    provider: gemini
    model: gemini-3.5-transcribe-live
  supervisor:
    enabled: true
    model: gemini-3.7-flash
    thinking_level: low
    mode: background
  prompts:
    directory: prompts/default
    system_inbound: system-inbound.md
    system_outbound: system-outbound.md
    greeting_inbound: greeting-inbound.txt
    greeting_outbound: greeting-outbound.txt
    greeting_instruction: greeting-instruction.md
    voicemail_instruction: voicemail-instruction.md
    ivr_instruction: ivr-instruction.md
    watchdog_instruction: watchdog-instruction.md
    watchdog_fallback: watchdog-fallback.txt
    supervisor: supervisor.md
telephony:
  ivr:
    enabled: false
    allowed_digits: "0123456789*#ABCD"
    max_digits_per_action: 32
    inter_digit_delay_seconds: 0.3
    navigation_timeout_seconds: 120
    audit_digits: false
  amd:
    enabled: false
    classifier_provider: auto
    gemini_model: gemini-2.5-flash-lite
    openai_model: gpt-4.1-mini
    wait_until_finished: true
    voicemail_action: hangup
    unavailable_action: hangup
    uncertain_action: continue
  cold_transfer:
    enabled: false
    ringing_timeout_seconds: 30
    play_dialtone: false
  noise_processing:
    krisp_enabled: false
performance:
  prewarm_workers: 1
  event_queue_size: 1024
  watchdog_silence_seconds: 2.5
  targets:
    turn_latency_p50_ms: 600
    turn_latency_p95_ms: 1200
    barge_in_stop_p95_ms: 250
    local_tool_p95_ms: 20
policy:
  require_commit_authorization: true
  allowed_country_codes:
    - DE
  block_emergency_numbers: true
  block_premium_numbers: true
storage:
  transcript: true
  audio: false
features:
  shadow_stt: false
  supervisor: true
  scripted_confirmations: true
  cascade_fallback: false
